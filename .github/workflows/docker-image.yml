name: Build, Scan & Deploy (Kubernetes)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/shopfast
  JAVA_VERSION: "21"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B clean test -DskipTests=false

  build-images:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (git SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install common-lib
        working-directory: backend
        run: mvn -q -f common-lib/pom.xml install -DskipTests

      - name: Build & push service images
        run: |
          SERVICES="eureka-server api-gateway product-service category-service user-service auth-service inventory-service order-service payment-service cart-service coupon-service review-service notification-service elastic-service admin-service"
          for svc in $SERVICES; do
            docker build -t "${{ env.IMAGE_PREFIX }}/$svc:${{ steps.tag.outputs.tag }}" \
                         -t "${{ env.IMAGE_PREFIX }}/$svc:latest" \
                         -f "backend/$svc/Dockerfile" backend
            docker push "${{ env.IMAGE_PREFIX }}/$svc:${{ steps.tag.outputs.tag }}"
            docker push "${{ env.IMAGE_PREFIX }}/$svc:latest"
          done

      - name: Build & push frontend image
        run: |
          docker build -t "${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tag.outputs.tag }}" \
                       -t "${{ env.IMAGE_PREFIX }}/frontend:latest" frontend
          docker push "${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tag.outputs.tag }}"
          docker push "${{ env.IMAGE_PREFIX }}/frontend:latest"

      - name: Trivy scan images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/api-gateway:${{ steps.tag.outputs.tag }}"
          format: table
          exit-code: "1"
          severity: CRITICAL

  deploy-dev:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (git SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > "$HOME/.kube/config"

      - name: Pin images to git SHA
        working-directory: k8s/overlays/dev
        run: |
          for svc in eureka-server api-gateway product-service category-service user-service auth-service inventory-service order-service payment-service cart-service coupon-service review-service notification-service elastic-service admin-service frontend; do
            kustomize edit set image "ghcr.io/${{ github.repository_owner }}/shopfast/$svc:dev=ghcr.io/${{ github.repository_owner }}/shopfast/$svc:${{ steps.tag.outputs.tag }}"
          done

      - name: Apply dev overlay
        run: kubectl apply -k k8s/overlays/dev
