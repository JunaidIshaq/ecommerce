<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Keycloak...</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-right: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .container { text-align: center; }
    .message { color: #666; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Redirecting to Keycloak login...</div>
  </div>
  <script>
    (function() {
      const baseUrl = 'https://shopfast.live/realms/shopfast/account';
      const clientId = 'shopfast-web';
      const redirectUri = 'https://shopfast.live/';
      const scope = 'openid profile email';
      const responseType = 'code';

      function generateRandomString(length) {
        const array = new Uint8Array(length);
        crypto.getRandomValues(array);
        return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
      }

      async function sha256(plain) {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode(...new Uint8Array(hash)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      async function redirect() {
        const state = generateRandomString(16);
        const codeVerifier = generateRandomString(64);
        const codeChallenge = await sha256(codeVerifier);

        sessionStorage.setItem('pkce_code_verifier', codeVerifier);
        sessionStorage.setItem('oauth_state', state);

        const params = new URLSearchParams({
          client_id: clientId,
          redirect_uri: redirectUri,
          response_type: responseType,
          scope: scope,
          state: state,
          code_challenge: codeChallenge,
          code_challenge_method: 'S256'
        });

        window.location.href = baseUrl + '?' + params.toString();
      }

      redirect().catch(err => {
        document.querySelector('.message').textContent = 'Error: ' + err.message;
      });
    })();
  </script>
</body>
</html>
