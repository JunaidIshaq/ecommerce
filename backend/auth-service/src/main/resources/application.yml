spring:
  cloud:
    openfeign:
      client:
        config:
          # Without explicit timeouts a slow downstream holds request threads until the
          # OS socket timeout, which is how one sick service takes the whole mesh down.
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      connect-timeout: 6000
    cache:
      type: redis

  datasource:
    url: ${POSTGRES_URI:jdbc:postgresql://postgres:5432/auth_db}
    username: postgres
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10        # Max connections per service
      minimum-idle: 5              # Idle connections
      idle-timeout: 30000          # 30 seconds
      max-lifetime: 1800000        # 30 minutes
      connection-timeout: 30000    # 30 seconds
      pool-name: ${spring.application.name}-pool

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}


  elasticsearch:
    uris: ${ELASTIC_URI:http://elasticsearch:9200}

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/eureka/}

server:
  port: ${SERVER_PORT:8087}

  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600          # seconds (1h)
  refresh-expiration: 86400        # seconds (24h)

logging:
  level:
    root: INFO
    org.springframework.data.redis: WARN
    org.springframework.cache.interceptor: DEBUG


elastic:
  host:
    name: elasticsearch

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: auth-service

app:
  seed-auth: true
  password:
    encryption:
      # AES-256-GCM encryption key for login password (Base64-encoded 32 bytes)
      # Frontend must encrypt the password using this key before sending to /api/v1/auth/login
      # No default on purpose: a committed default here would mean every deployment
      # that forgot to set it shares one publicly-known password encryption key.
      key: ${APP_PASSWORD_ENCRYPTION_KEY}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8086}

category:
  service:
    url: ${CATEGORY_SERVICE_URL:http://category-service:8082}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8081}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}

# Resilience4j: stop a sick downstream from consuming this service's threads.
# slidingWindow is COUNT_BASED so behaviour is predictable under low traffic.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      cart-service:
        baseConfig: default
      coupon-service:
        baseConfig: default
      payment-service:
        baseConfig: default
        # Payments are never auto-retried, so open slower and recover slower.
        failureRateThreshold: 70
        waitDurationInOpenState: 30s
      product-service:
        baseConfig: default
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
    instances:
      cart-service:
        baseConfig: default
      coupon-service:
        baseConfig: default
      product-service:
        baseConfig: default
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
