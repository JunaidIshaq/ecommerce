      - ELASTIC_URI=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - SERVER_PORT=8092
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=false
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8092/actuator/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - product-net

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: admin-service
    environment:
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/shopfast}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI:-}
      - POSTGRES_URI=jdbc:postgresql://postgres:5432/admin_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - KAFKA_BOOTSTRAP=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - SERVER_PORT=8093
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=false
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - EUREKA_URL=http://eureka-server:8761/eureka/eureka/
      - USER_SERVICE_URL=http://user-service:8086
      - ORDER_SERVICE_URL=http://order-service:8084
      - CART_SERVICE_URL=http://cart-service:8088
      - CATEGORY_SERVICE_URL=http://category-service:8082
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - COUPON_SERVICE_URL=http://coupon-service:8089
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8093/actuator/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - product-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181", "|", "grep", "imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - product-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:9093:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - SERVER_SERVLET_CONTEXT_PATH=/kafka
      - MANAGEMENT_SERVER_BASE_PATH=/kafka
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/kafka/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - product-net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-net

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-net

