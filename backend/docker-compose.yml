  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8761/eureka/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - product-net

  # Keycloak: the OIDC identity provider. Dev mode here (plain HTTP) because it only
  # ever talks over the internal product-net; docker-compose.prod.yml runs `start`
  # with a real hostname behind TLS. The realm is imported from a version-controlled
  # JSON on every boot so realm config is never "clicked into" the admin console.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: [ "start-dev", "--import-realm", "--http-port=8180" ]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set in .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      # Keycloak is served at https://shopfast.live/auth/ by the host's nginx rather
      # than on its own subdomain, so it must know two things it cannot infer:
      #   - the path it is mounted under, or every URL it generates (redirects, the
      #     JWKS location in its discovery document) would omit /auth and 404;
      #   - the public origin, because the `iss` claim it stamps into every token
      #     must match what resource servers expect, and it only sees nginx.
      - KC_HTTP_RELATIVE_PATH=${KEYCLOAK_RELATIVE_PATH:-/}
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-}
      # Trust X-Forwarded-* from nginx. Without this Keycloak sees the proxy's
      # http://127.0.0.1 and builds redirect URLs the browser cannot follow.
      - KC_PROXY_HEADERS=xforwarded
      # Client secrets are substituted into realm-export.json at import time so no
      # secret is ever committed to the repo.
      - SHOPFAST_SERVICES_CLIENT_SECRET=${SHOPFAST_SERVICES_CLIENT_SECRET:?SHOPFAST_SERVICES_CLIENT_SECRET must be set in .env}
      - SHOPFAST_ADMIN_CLIENT_SECRET=${SHOPFAST_ADMIN_CLIENT_SECRET:?SHOPFAST_ADMIN_CLIENT_SECRET must be set in .env}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image is distroless - no curl, no wget. Bash's /dev/tcp is the
      # only HTTP client available, hitting the management port health endpoint.
      # The management endpoints sit under KC_HTTP_RELATIVE_PATH too, so the probe
      # must include it or it gets a 404 and the container never reports healthy.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET ${KEYCLOAK_RELATIVE_PATH:-}/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - product-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI:-}
      - SPRING_REDIS_HOST=redis
      # Legacy HS256 secret. Still needed during the dual-token migration window so
      # tokens minted by the old auth-service keep validating. Remove after phase 4.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/shopfast}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - keycloak
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - category-service
      - cart-service
      - coupon-service
      - review-service
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - product-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.5
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 1m
      timeout: 10s
      retries: 5
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - product-net

