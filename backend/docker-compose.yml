      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI:-}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - CATEGORY_SERVICE_URL=http://category-service:8082/api/v1/category
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - SERVER_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - APP_SEED_PRODUCTS=true
