spring:
  cloud:
    openfeign:
      client:
        config:
          # Without explicit timeouts a slow downstream holds request threads until the
          # OS socket timeout, which is how one sick service takes the whole mesh down.
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic
  application:
    name: order-service

  datasource:
    url: ${POSTGRES_URI:jdbc:postgresql://postgres:5432/order_db}
    username: postgres
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10        # Max connections per service
      minimum-idle: 5              # Idle connections
      idle-timeout: 30000          # 30 seconds
      max-lifetime: 1800000        # 30 minutes
      connection-timeout: 30000    # 30 seconds
      pool-name: ${spring.application.name}-pool

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 10
        delivery.timeout.ms: 120000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      connect-timeout: 6000
  cache:
    type: redis

  elasticsearch:
    uris: ${ELASTIC_URI:http://elasticsearch:9200}

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/eureka/

server:
  port: ${SERVER_PORT:8084}

  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.data.redis: WARN
    org.springframework.cache.interceptor: DEBUG


elastic:
  host:
    name: elasticsearch

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service

app:
  seed-order: true

cart:
  service:
    url: ${CART_SERVICE_URL:http://cart-service:8088}

category:
  service:
    url: ${CATEGORY_SERVICE_URL:http://category-service:8082}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8081}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8085}

# Resilience4j: stop a sick downstream from consuming this service's threads.
# slidingWindow is COUNT_BASED so behaviour is predictable under low traffic.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 3s
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      cart-service:
        baseConfig: default
      coupon-service:
        baseConfig: default
      payment-service:
        baseConfig: default
        # Payments are never auto-retried, so open slower and recover slower.
        failureRateThreshold: 70
        waitDurationInOpenState: 30s
      product-service:
        baseConfig: default
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
    instances:
      cart-service:
        baseConfig: default
      coupon-service:
        baseConfig: default
      product-service:
        baseConfig: default
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      inventory-service:
        baseConfig: default

---
# --- Keycloak resource server ------------------------------------------------
# Appended as a second YAML document (note the ---) on purpose: the files already
# have a top-level `spring:` key and a duplicate key in one document makes Spring
# Boot refuse to start. Separate documents are merged instead.
# Tokens are verified offline against the realm's public JWKS, fetched from the
# issuer's discovery document and refreshed automatically on key rotation.
# Nothing here is a secret: the service only ever needs the PUBLIC key.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://shopfast.live/realms/shopfast}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

shopfast:
  security:
    # Service-to-service credentials. Absent in local runs, in which case the
    # Feign interceptor simply relays the caller's token instead.
    service-client:
      client-id: shopfast-services
      client-secret: ${SHOPFAST_SERVICES_CLIENT_SECRET:}
