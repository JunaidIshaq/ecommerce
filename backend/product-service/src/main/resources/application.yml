spring:
  application:
    name: product-service
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      connect-timeout: 6000
    cache:
      type: redis

  datasource:
    url: ${POSTGRES_URI:jdbc:postgresql://postgres:5432/product_db}
    username: postgres
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10        # Max connections per service
      minimum-idle: 5              # Idle connections
      idle-timeout: 30000          # 30 seconds
      max-lifetime: 1800000        # 30 minutes
      connection-timeout: 30000    # 30 seconds
      pool-name: ${spring.application.name}-pool

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties.hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:product-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        acks: all
        enable.idempotence: true
        retries: 10
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
  elasticsearch:
    uris: ${ELASTIC_URI:}

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/eureka/

server:
  port: ${SERVER_PORT:8081}

  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.data.redis: WARN
    org.springframework.cache.interceptor: DEBUG


elastic:
  host:
    name: elasticsearch

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: product-service

app:
  seed-products: true

category:
  service:
    url: ${CATEGORY_SERVICE_URL:http://category-service:8082/api/v1/category}

---
# --- Keycloak resource server ------------------------------------------------
# Appended as a second YAML document (note the ---) on purpose: the files already
# have a top-level `spring:` key and a duplicate key in one document makes Spring
# Boot refuse to start. Separate documents are merged instead.
# Tokens are verified offline against the realm's public JWKS, fetched from the
# issuer's discovery document and refreshed automatically on key rotation.
# Nothing here is a secret: the service only ever needs the PUBLIC key.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://shopfast.live/realms/shopfast}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

shopfast:
  security:
    # Service-to-service credentials. Absent in local runs, in which case the
    # Feign interceptor simply relays the caller's token instead.
    service-client:
      client-id: shopfast-services
      client-secret: ${SHOPFAST_SERVICES_CLIENT_SECRET:}
