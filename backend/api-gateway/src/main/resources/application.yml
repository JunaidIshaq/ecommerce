spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Explicit routes keyed on the public URL prefix. These exist so nginx can
      # forward /api/** to the gateway unchanged: the discovery locator below only
      # answers on /<service-id>/**, which is not the URL the browser calls, and
      # relying on it alone is what made it tempting to bypass the gateway and
      # proxy straight to each service - taking gateway authentication out of the
      # request path entirely.
      routes:
        # ---------------------------------------------------------------
        # Public alias routes.
        #
        # Anything under /api/v1/public/<service>/** is reachable without a
        # token. The /public segment is stripped here and the request is
        # forwarded to the service's normal path, so the service itself never
        # sees "/public" and its own security rules still apply to the real
        # path. That matters: it means this alias cannot be used to reach an
        # endpoint that the service would otherwise protect. Asking for
        # /api/v1/public/order/123 rewrites to /api/v1/order/123, which
        # order-service still answers with 401.
        #
        # These must be declared before the non-public routes: Spring Cloud
        # Gateway evaluates routes in order and /api/v1/public/product/** would
        # otherwise never be reached.
        # ---------------------------------------------------------------
        - id: product-service-public
          uri: lb://product-service
          predicates:
            - Path=/api/v1/public/product/**
          filters:
            - RewritePath=/api/v1/public/product(?<segment>/?.*), /api/v1/product$\{segment}
        - id: category-service-public
          uri: lb://category-service
          predicates:
            - Path=/api/v1/public/category/**
          filters:
            - RewritePath=/api/v1/public/category(?<segment>/?.*), /api/v1/category$\{segment}
        - id: elastic-service-public
          uri: lb://elastic-service
          predicates:
            - Path=/api/v1/public/search/**
          filters:
            - RewritePath=/api/v1/public/search(?<segment>/?.*), /api/v1/search$\{segment}
        - id: review-service-public
          uri: lb://review-service
          predicates:
            - Path=/api/v1/public/review/**
          filters:
            - RewritePath=/api/v1/public/review(?<segment>/?.*), /api/v1/review$\{segment}

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/product/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/v1/category/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/order/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/v1/review/**
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/v1/coupon/**
        - id: elastic-service
          uri: lb://elastic-service
          predicates:
            - Path=/api/v1/search/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payment/**
      discovery:
        locator:
          enabled: true  # Enable dynamic routing via Eureka
          lower-case-service-id: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 6000
      connect-timeout: 6000
  cache:
    type: redis

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/eureka/


api-gateway:
  environment:
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/eureka/


server:
  port: ${SERVER_PORT:8080}

  forward-headers-strategy: framework

keycloak:
  # Discovery document root. The gateway fetches the realm's public JWKS from here
  # and refreshes it automatically when Keycloak rotates signing keys.
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/shopfast}
  # Optional internal JWKS URL, so the gateway fetches signing keys over the docker
  # network instead of hairpinning back out through the public HTTPS endpoint.
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

jwt:
  # Legacy HS256 secret, accepted only for the duration of the migration. Clearing
  # this value (or removing JWT_SECRET from the environment) immediately stops the
  # gateway accepting old auth-service tokens - that is the kill switch for phase 4.
  secret: ${JWT_SECRET:}
  access-expiration: 3600          # seconds (1h)
  refresh-expiration: 86400        # seconds (24h)

logging:
  level:
    root: INFO
    org.springframework.data.redis: WARN
    org.springframework.cache.interceptor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway