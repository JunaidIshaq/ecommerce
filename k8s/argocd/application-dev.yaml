apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopfast-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shopfast/shopfast.git
    targetRevision: HEAD
    path: k8s/overlays/dev
    kustomize:
      namePrefix: shopfast-
  destination:
    server: https://kubernetes.default.svc
    namespace: shopfast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Kustomize=true
