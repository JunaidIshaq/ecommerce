# API Gateway — single entry point. Routes /api/* to downstream services via
# Eureka. Holds the dual-token config (Keycloak RS256 + legacy HS256) and the
# service-to-service client secret. Has a Redis-backed rate limiter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopfast
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/shopfast/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shopfast-config
            - secretRef:
                name: shopfast-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_REDIS_HOST
              value: "redis"
            # Legacy HS256 secret. Still needed during the dual-token migration
            # window so tokens minted by the old auth-service keep validating.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopfast-secrets
                  key: JWT_SECRET
            # Must equal the issuer (iss) Keycloak puts in tokens, which is derived
            # from KC_HOSTNAME (https://shopfast.live). The gateway validates every
            # JWT's iss against this value, so it has to be the public URL, not the
            # internal service URL.
            - name: KEYCLOAK_ISSUER_URI
              value: "https://shopfast.live/realms/shopfast"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/eureka/"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopfast
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
