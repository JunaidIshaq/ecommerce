apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-config
  namespace: shopfast
data:
  main.cf: |
    myhostname = mail.shopfast.live
    mydomain = shopfast.live
    myorigin = $mydomain
    mydestination = shopfast.live, localhost
    relay_domains = shopfast.live
    smtpd_banner = $myhostname ESMTP
    smtpd_tls_cert_file = /opt/postfix-tls/cert.pem
    smtpd_tls_key_file = /opt/postfix-tls/key.pem
    smtpd_use_tls = yes
    smtpd_tls_security_level = may
    smtp_tls_security_level = may
    smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt
    smtpd_sasl_auth_enable = yes
    smtpd_sasl_type = dovecot
    smtpd_sasl_path = inet:localhost:2525
    smtpd_recipient_restrictions = permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination
    smtpd_client_restrictions = permit_sasl_authenticated, reject
    inet_interfaces = all
    mynetworks = 127.0.0.0/8, 10.42.0.0/16, 172.16.0.0/12
    config_directory = /etc/postfix/conf.d
  master.cf: |
    # Postfix master.cf — enables submission (587) + submissions (465) with SASL
    # auth delegated to dovecot (auth-tcp on 2525). Base smtp/25 service is kept.
    smtp      inet  n       -       n       -       -       smtpd

    submission inet  n       -       y       -       -       smtpd
      -o syslog_name=postfix/submission
      -o smtpd_tls_security_level=encrypt
      -o smtpd_sasl_auth_enable=yes
      -o smtpd_sasl_type=dovecot
      -o smtpd_sasl_path=inet:127.0.0.1:2525
      -o smtpd_sasl_security_options=noanonymous
      -o smtpd_tls_auth_only=yes
      -o smtpd_client_restrictions=permit_mynetworks,permit_sasl_authenticated,reject
      -o smtpd_recipient_restrictions=permit_mynetworks,permit_sasl_authenticated,reject_unauth_destination

    smtps     inet  n       -       y       -       -       smtpd
      -o syslog_name=postfix/smtps
      -o smtpd_tls_wrappermode=yes
      -o smtpd_sasl_auth_enable=yes
      -o smtpd_sasl_type=dovecot
      -o smtpd_sasl_path=inet:127.0.0.1:2525
      -o smtpd_sasl_security_options=noanonymous
      -o smtpd_client_restrictions=permit_mynetworks,permit_sasl_authenticated,reject
      -o smtpd_recipient_restrictions=permit_mynetworks,permit_sasl_authenticated,reject_unauth_destination

    pickup    unix  n       -       y       60      1       pickup
    cleanup   unix  n       -       y       -       0       cleanup
    qmgr      unix  n       -       n       300     1       qmgr
    tlsmgr    unix  -       -       y       1000?   1       tlsmgr
    rewrite   unix  -       -       y       -       -       trivial-rewrite
    bounce    unix  -       -       y       -       0       bounce
    defer     unix  -       -       y       -       0       error
    trace     unix  -       -       y       -       0       error
    verify    unix  -       -       y       -       1       verify
    flush     unix  n       -       y       1000?   0       flush
    proxymap  unix  -       -       n       -       -       proxymap
    proxywrite unix -       -       n       -       1       proxymap
    smtp      unix  -       -       y       -       -       smtp
    relay     unix  -       -       y       -       -       smtp -o syslog_name=postfix/$service_name
    showq     unix  n       -       y       -       -       showq
    error     unix  -       -       y       -       -       error
    retry     unix  -       -       y       -       -       error
    discard   unix  -       -       y       -       -       discard
    local     unix  -       -       n       -       -       local
    virtual   unix  -       -       n       -       -       virtual
    lmtp      unix  -       -       y       -       -       lmtp
    anvil     unix  -       -       y       -       1       anvil
    scache    unix  -       -       y       -       1       scache
    postlog   unix-dgram n  -       y       -       1       postlogd
