apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-server
  namespace: shopfast
  labels:
    app: mail-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-server
  template:
    metadata:
      labels:
        app: mail-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      initContainers:
        - name: init-mail-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown root:users /var/mail && chmod 0775 /var/mail && chown -R admin:users /var/mail/*.admin 2>/dev/null || true"]
          volumeMounts:
            - name: mail-storage
              mountPath: /var/mail
      volumes:
        - name: mail-storage
          persistentVolumeClaim:
            claimName: mail-storage
        - name: postfix-tls
          secret:
            secretName: mail-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
        - name: postfix-config
          configMap:
            name: postfix-config
            items:
              - key: main.cf
                path: main.cf
              - key: master.cf
                path: master.cf
      containers:
        - name: dovecot
          image: localhost:5000/shopfast/dovecot:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 143
              name: imap
            - containerPort: 2525
              name: auth-tcp
          volumeMounts:
            - name: mail-storage
              mountPath: /var/mail
          readinessProbe:
            tcpSocket:
              port: 143
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
        - name: postfix
          image: localhost:5000/shopfast/postfix:v16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 587
              name: submission
            - containerPort: 465
              name: submissions
          volumeMounts:
            - name: mail-storage
              mountPath: /var/mail
            - name: postfix-tls
              mountPath: /opt/postfix-tls
            - name: postfix-config
              mountPath: /etc/postfix/main.cf
              subPath: main.cf
            - name: postfix-config
              mountPath: /etc/postfix/master.cf
              subPath: master.cf
          readinessProbe:
            tcpSocket:
              port: 587
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
