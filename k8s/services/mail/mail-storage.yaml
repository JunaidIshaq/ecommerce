apiVersion: v1
kind: PersistentVolume
metadata:
  name: mail-storage
  namespace: shopfast
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/mail
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-storage
  namespace: shopfast
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
