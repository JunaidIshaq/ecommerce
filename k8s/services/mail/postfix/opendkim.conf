Syslog                  yes
SyslogSuccess            yes
LogWhy                   yes

Canonicalization         relaxed/simple
Mode                     sv
SubDomains               no
AutoRestart              yes
AutoRestartRate          10/1h
Background               yes
DNSTimeout               5
SignatureAlgorithm       rsa-sha256

# Socket the postfix milter connects to (TCP loopback; avoids postfix chroot
# unix-socket permission issues). libmilter format: inet:<port>@<host>
Socket                  inet:8891@127.0.0.1

UserID                  opendkim

# Where the signing/key tables live
SigningTable            refile:/etc/opendkim/SigningTable
KeyTable                refile:/etc/opendkim/KeyTable
TrustAnchorFile         /etc/opendkim/TrustedHosts

ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts
InternalHosts           refile:/etc/opendkim/TrustedHosts
