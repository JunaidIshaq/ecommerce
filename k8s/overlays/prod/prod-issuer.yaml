# Let's Encrypt ClusterIssuer for production TLS (replaces the dev self-signed
# Issuer). Requires a publicly reachable ingress and a real email.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@shopfast.live
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
