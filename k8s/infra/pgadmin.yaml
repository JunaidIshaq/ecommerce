# ---------------------------------------------------------------------------
# pgAdmin 4 — web UI for browsing the PostgreSQL databases (shopfast.live/pgadmin).
#
# Login with the PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD below, then
# register a server: host=postgres, port=5432, user=postgres, db=postgres
# (password is the shopfast-secrets DB_PASSWORD).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: shopfast
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@shopfast.live"
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopfast-secrets
                  key: DB_PASSWORD
            - name: PGADMIN_LISTEN_PORT
              value: "80"
            - name: SCRIPT_NAME
              value: "/pgadmin"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /pgadmin/misc/ping
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /pgadmin/misc/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: shopfast
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
