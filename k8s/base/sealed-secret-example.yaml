# ---------------------------------------------------------------------------
# Example: managing secrets safely with SealedSecrets (plan section 9).
#
# 1. Install the Sealed Secrets controller:
#      helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#      helm install sealed-secrets -n kube-system sealed-secrets/sealed-secrets
#
# 2. Seal the secret once (it is safe to commit the *sealed* resource):
#      kubectl create secret generic shopfast-secrets \
#        --namespace shopfast --dry-run=client -o json \
#        | kubeseal --format yaml > sealed-secret.yaml
#
# 3. Apply sealed-secret.yaml; the controller recreates shopfast-secrets.
#
# This file is documentation only — commented out so it does not apply raw.
# ---------------------------------------------------------------------------
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: shopfast-secrets
#   namespace: shopfast
#   annotations:
#     sealedsecrets.bitnami.com/managed: "true"
# spec:
#   encryptedData:
#     DB_PASSWORD: <kubeseal output>
#     JWT_SECRET: <kubeseal output>
#     APP_PASSWORD_ENCRYPTION_KEY: <kubeseal output>
#     KEYCLOAK_ADMIN_PASSWORD: <kubeseal output>
#     SHOPFAST_SERVICES_CLIENT_SECRET: <kubeseal output>
