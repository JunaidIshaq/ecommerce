# ---------------------------------------------------------------------------
# Shared configuration for all ShopFast services.
#
# Non-secret values only. Secrets live in 02-secrets.yaml (populated from the
# same .env that docker-compose uses — never commit raw values).
#
# Names follow Kubernetes DNS: e.g. postgres.shopfast.svc.cluster.local
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopfast-config
  namespace: shopfast
data:
  KEYCLOAK_REALM: "shopfast"
  KEYCLOAK_ADMIN_CLIENT_ID: "shopfast-services"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  EUREKA_URL: "http://eureka-server:8761/eureka/eureka/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/eureka/"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8180/realms/shopfast"
  KEYCLOAK_BASE_URL: "http://keycloak:8180"
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8180/realms/shopfast/protocol/openid-connect/certs"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  ELASTIC_URI: "http://elasticsearch:9200"
  LOGSTASH_HOST: "logstash"
  LOGSTASH_PORT: "5000"
  IMAGE_PULL_POLICY: "IfNotPresent"
  # Default single replica for leaf services; busy services override via HPA.
  SERVICE_REPLICAS: "2"
  SERVICE_REQUESTS_CPU: "200m"
  SERVICE_REQUESTS_MEM: "512Mi"
  SERVICE_LIMITS_CPU: "1000m"
  SERVICE_LIMITS_MEM: "1Gi"
  IMAGE_REGISTRY: "ghcr.io/shopfast"
  IMAGE_TAG: "latest"
  # Force the JVM to bind sockets on IPv4 (0.0.0.0) instead of IPv6 (::).
  # On Java 21 the stack defaults to IPv6, which makes ClusterIP (IPv4)
  # services unable to reach the pods, breaking service-to-service calls
  # and wait-for-deps init containers.
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"
